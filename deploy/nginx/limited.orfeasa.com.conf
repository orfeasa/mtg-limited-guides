server {
    listen 80;
    listen [::]:80;
    server_name limited.orfeasa.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name limited.orfeasa.com;

    ssl_certificate /etc/letsencrypt/live/limited.orfeasa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/limited.orfeasa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/orfeas/apps/mtg-limited-guides/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|webmanifest|svg|png|jpe?g|ttf)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

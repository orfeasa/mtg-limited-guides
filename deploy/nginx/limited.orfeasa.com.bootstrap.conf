server {
    listen 80;
    listen [::]:80;
    server_name limited.orfeasa.com;

    root /home/orfeas/apps/mtg-limited-guides/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
